name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore apps/api

      # TreatWarningsAsErrors açık: uyarı = kırmızı build.
      - name: Build
        run: dotnet build apps/api --no-restore --configuration Release

      - name: Test
        run: dotnet test apps/api --no-build --configuration Release --logger "console;verbosity=normal"
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=expyra_test;Username=postgres;Password=postgres"

  frontend:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Sürüm burada verilmez — kök package.json'daki "packageManager"
      # alanından okunur. İkisini birden vermek ERR_PNPM_BAD_PM_VERSION verir.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

  secrets-scan:
    name: Sır taraması
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Eski projede canlı DB şifresi repoya girmişti. Bu iş bir daha
      # gözden kaçmasın diye CI'da otomatik taranıyor.
      #
      # gitleaks-action yerine ikiliyi doğrudan çalıştırıyoruz: action, push
      # olayında "önceki commit..şimdiki commit" aralığı kuruyor ve ilk commit'te
      # parent bulunmadığı için çöküyor. Biz her seferinde tüm geçmişi tarıyoruz.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --no-banner .
